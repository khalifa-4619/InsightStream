# ================================
# MAIN SERVER BLOCK
# ================================
server {

    # Listen for incoming HTTP requests on port 80
    listen 80;

    # Domain name (localhost for development / Docker)
    server_name localhost;


    # ================================
    # FRONTEND (STATIC FILES - REACT BUILD)
    # ================================

    # Directory where your built React files live inside the container
    root /usr/share/nginx/html;

    # Default file to serve when user visits "/"
    index index.html;


    # ================================
    # REACT SPA ROUTING
    # ================================
    location / {

        # Try to serve the exact file requested:
        # 1. $uri      → exact file (e.g. /logo.png)
        # 2. $uri/     → directory
        # 3. fallback  → index.html (VERY IMPORTANT for SPA)
        #
        # Why?
        # React handles routes like /dashboard, /profile
        # Nginx doesn't know these routes → so we always return index.html
        try_files $uri $uri/ /index.html;
    }


    # ================================
    # AUTHENTICATION ENDPOINTS
    # ================================

    # Login endpoint → forwarded to backend (FastAPI)
    location /login {

        # Forward request to backend service (Docker service name: "backend")
        proxy_pass http://backend:8000;

        # Preserve original request information
        proxy_set_header Host $host;                     # original domain
        proxy_set_header X-Real-IP $remote_addr;         # user's real IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # proxy chain
    }

    # Signup endpoint → also forwarded to backend
    location /signup {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ================================
    # USER MANAGEMENT ENDPOINTS
    # ================================
    location /users/ {

        # Any request like /users/, /users/1 → goes to backend
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ================================
    # DATASETS ENDPOINTS
    # (upload, list, delete, download)
    # ================================
    location /datasets/ {

        # Forward dataset-related API calls to backend
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ================================
    # LOGS (REST API)
    # ================================
    location /logs/ {

        # Fetch logs via normal HTTP requests
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ================================
    # ANALYTICS / GENERAL API ROUTES
    # ================================
    location /api/ {

        # Catch-all for API routes not explicitly defined above
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    # ================================
    # WEBSOCKET SUPPORT (REAL-TIME)
    # ================================
    location /ws/ {

        # Forward WebSocket requests to backend
        proxy_pass http://backend:8000;

        # Required for WebSocket (HTTP/1.1 persistent connection)
        proxy_http_version 1.1;

        # Upgrade HTTP connection → WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preserve client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}